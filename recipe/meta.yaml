{% set version = "2026.11.07" %}

package:
  name: pangeo-notebook
  version: {{ version }}

build:
  number: 0
  noarch: generic

requirements:
  run:
    - pangeo-dask =2026.10.8
    - dask-labextension =7.0.0
    - ipywidgets =8.1.9
    - jupyter-server-proxy =4.6.0
    - jupyterhub-singleuser =6.2.0
    - jupyterlab =4.6.6
    - nbgitpuller =1.3.0

test:
  commands:
    - jupyter -h

about:
  home: http://pangeo.io
  license: MIT
  license_file: LICENSE
  summary: "pangeo notebook dependencies"

extra:
  recipe-maintainers:
    - jsignell
    - weiji14
    - yuvipanda
    - scottyhq 
    - jhamman
    - TomAugspurger
